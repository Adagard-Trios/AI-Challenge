version: '3.8'

services:
  # Neo4j Knowledge Graph (Production Feature)
  neo4j:
    image: neo4j:5.15-community
    container_name: slac2026-neo4j
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/slac2026
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - ./backend/data/neo4j/data:/data
      - ./backend/data/neo4j/logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p slac2026 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PYTHONUNBUFFERED=1
      - NEO4J_ENABLED=true
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=slac2026
    volumes:
      # Runtime state only. Mounting ./backend/src over the image meant the
      # container ran host source rather than what was built, which hides a
      # stale image and diverges from how this deploys anywhere else.
      - ./backend/data:/app/backend/data
    # No `command:` override. `python main.py` does start a server -- there is
    # a __main__ block -- but it hardcodes port 8000 and bypasses
    # scripts/start_backend.sh, which is what honours $PORT and skips training
    # when DISABLE_AUTO_TRAIN is set. Use the image's CMD.
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # BUILD args, not `environment`. Next inlines NEXT_PUBLIC_* into the
        # client bundle at build time; setting them at runtime does nothing,
        # which is the most common way this frontend ends up deployed pointing
        # at localhost.
        #
        # And this is the BROWSER's view of the API, so it must be a URL the
        # browser can reach. http://backend:8000 resolves only inside the
        # compose network -- the browser is not in it, so every request failed.
        #
        # Both names: eight components read NEXT_PUBLIC_API_URL while
        # AnomalyDetection.tsx and StockPredictions.tsx read
        # NEXT_PUBLIC_API_BASE.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    # No volumes. The previous `./frontend:/app` mounted host source over the
    # built image, so the container ran an unbuilt tree; `/app/. next` (note
    # the space) created an anonymous volume at a path that does not exist
    # rather than shielding .next as intended.
    restart: unless-stopped
