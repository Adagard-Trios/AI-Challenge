# Local container stack: backend + frontend.
#
# The previous version of this file had never been run successfully. It was
# broken in four independent ways, each of which alone would have failed the
# first `docker compose up`:
#
#   command: python backend/api/main.py   -> the Dockerfile ends with
#                                            WORKDIR /app/backend, so this
#                                            resolved to
#                                            /app/backend/backend/api/main.py.
#                                            No such file, and it overrode the
#                                            CMD that does work.
#   volumes: ./src:/app/src               -> there is no src/ at the repo root
#                                            (it lives at backend/src). Docker
#                                            silently created an empty dir.
#   frontend build: ./frontend            -> frontend/Dockerfile did not exist.
#                                            This is the fatal one: the build
#                                            fails before anything starts.
#   NEXT_PUBLIC_API_URL as `environment`  -> Next inlines NEXT_PUBLIC_* at
#                                            BUILD time. Setting it at runtime
#                                            does nothing at all.
#
# For the production stack with Neo4j, see docker-compose.prod.yml.

services:
  # ---------------------------------------------------------------------------
  # Shared state. Bring these up alone with:
  #     docker compose up -d redis postgres
  # which is all the backend needs to run from the host venv.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # appendonly is not optional here.
    #
    # Almost everything Redis holds for this app is reconstructible -- cached
    # state, the seen-event set, WebSocket tickets. The social pacing deadline
    # is NOT. It is the 15-minute gate that keeps a personal Instagram account
    # from looking like a bot, and it exists as a key with a TTL. A Redis
    # restart with an empty dataset releases every gate at once, and every
    # replica collects simultaneously.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: roger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roger-local-dev}
      POSTGRES_DB: roger
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -U matters: without it pg_isready checks the OS user (root) rather than
      # the database user, and reports ready before roger/roger exists.
      test: ["CMD-SHELL", "pg_isready -U roger -d roger"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8100:8000"
    volumes:
      - chroma-data:/data
    environment:
      ANONYMIZED_TELEMETRY: "False"
      IS_PERSISTENT: "TRUE"
    healthcheck:
      # bash's own /dev/tcp, because the chroma image has NO probe tool at all
      # -- no curl, no wget, no python, no nc. Two of my attempts failed here
      # and reported a container "unhealthy" for hours while its endpoint
      # returned 200 to the host, which is worse than having no check: it says
      # something is wrong when nothing is.
      #
      # This tests that the port is accepting connections, not that the API
      # answers. That is the honest limit of what can be checked from inside
      # THIS image.
      #
      # Note the Kubernetes manifests are unaffected and do check HTTP: an
      # httpGet probe is performed BY THE KUBELET from outside the container,
      # so it needs no tools in the image. That difference is exactly why a
      # compose healthcheck and a k8s probe are not the same problem.
      # CMD with an explicit bash, NOT CMD-SHELL. /dev/tcp is a bash builtin
      # and CMD-SHELL runs /bin/sh, which is dash here -- it reports
      # "cannot create /dev/tcp/...: Directory nonexistent", because it is
      # looking for a real file.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-roger}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-roger-local-dev}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      # Context MUST be the repo root: the image needs models/, which is a
      # sibling of backend/, and main.py resolves it as
      # Path(__file__).parent.parent / "models".
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:?set GROQ_API_KEY in .env or the environment}
      - PYTHONUNBUFFERED=1
      - PORT=8000
      # Service names, not localhost: these resolve on the compose network.
      # From the HOST venv use localhost:5432 / localhost:6379 instead.
      - DATABASE_URL=postgresql+psycopg://roger:${POSTGRES_PASSWORD:-roger-local-dev}@postgres:5432/roger
      - REDIS_URL=redis://redis:6379/0
      # Post images. A local directory cannot be shared, and an
      # absolute path written by one pod means nothing on another.
      - S3_ENDPOINT=minio:9000
      - S3_BUCKET=roger-images
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-roger}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-roger-local-dev}
      # Training inside the API container delays the port bind past the health
      # check and OOMs small instances. Artefacts are committed under
      # models/*/artifacts.
      - DISABLE_AUTO_TRAIN=1
      # Let the health check pass before five scraping agents start.
      - AGENT_LOOP_START_DELAY=45
      # Social collection cannot work in a container: connecting an account
      # opens a VISIBLE browser for 2FA and encrypts the session to the host's
      # OS keyring. Say so explicitly rather than letting it fail at runtime.
      - DISABLE_LOCAL_SOCIAL_SESSIONS=1
    volumes:
      # Runtime state only. Deliberately NOT mounting source over the image:
      # the container runs what was built, and a source mount hides the fact
      # that the image is stale.
      - ./backend/data:/app/backend/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # No `command:` override. The image's CMD runs scripts/start_backend.sh,
    # which honours $PORT and binds 0.0.0.0 -- both required here.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      # The first cycle builds the LangGraph and warms the ONNX embedder, so
      # allow a slow start rather than restarting a container that is working.
      start_period: 90s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # BUILD-time, and both names. Eight components read
        # NEXT_PUBLIC_API_URL; AnomalyDetection.tsx and StockPredictions.tsx
        # read NEXT_PUBLIC_API_BASE. Setting only one leaves those two panels
        # pointed at localhost:8000, which surfaces as an opaque CORS error.
        #
        # This is the browser's view of the API, so it is localhost (the host
        # port mapping), NOT http://backend:8000 -- that name only resolves
        # inside the compose network, and the browser is not in it.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  minio-data:
  chroma-data:
  redis-data:
  postgres-data:
