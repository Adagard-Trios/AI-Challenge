# Render Blueprint, Sri Lanka AI Challenge 2026 frontend (Next.js 16)
#
# Apply from the Render dashboard: New -> Blueprint -> this repo, then point the
# blueprint at frontend/render.yaml.
#
# Runs a real Next server (`next start`) rather than a static export, so server
# features remain available: API routes, server actions, SSR, middleware.

services:
  - type: web
    name: slac2026-frontend
    runtime: node
    rootDir: frontend

    region: singapore
    plan: free

    # --include=dev is deliberate: typescript, tailwindcss and
    # babel-plugin-react-compiler are devDependencies and are required to BUILD.
    # If NODE_ENV=production leaks into the build environment, a bare `npm ci`
    # skips devDependencies and the build fails.
    #
    # `npm ci` (not `npm install`): clsx and three @radix-ui packages are imported
    # but not declared in package.json, they resolve only as hoisted transitives
    # from the committed lockfile. `npm install` may re-resolve and break the build.
    buildCommand: npm ci --include=dev && npm run build

    # Render injects $PORT and routes to it. `next start` does read PORT from the
    # environment, but pass it explicitly so the binding is not implicit.
    startCommand: npm start -- -p $PORT

    healthCheckPath: /

    envVars:
      # BUILD-TIME values, Next inlines NEXT_PUBLIC_* into the client bundle at
      # build time regardless of hosting model. Changing either requires a
      # redeploy, not just a restart.
      #
      # Set BOTH to the backend's Render URL. The codebase reads two different
      # names: 8 components use NEXT_PUBLIC_API_URL, while
      # dashboard/AnomalyDetection.tsx and dashboard/StockPredictions.tsx use
      # NEXT_PUBLIC_API_BASE. Setting only one leaves those two panels pointing at
      # http://localhost:8000 in production.
      #   e.g. https://roger-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_API_BASE
        sync: false

      # Next 16 requires Node >= 20.9. Pinned because package.json has no engines
      # field, so the build would otherwise follow Render's rolling default.
      - key: NODE_VERSION
        value: "22"

    # Free-plan notes:
    #   - 512 MB RAM. The running Next server is comfortable in that; the `next
    #     build` step is the tighter part. If the build is OOM-killed, either
    #     raise plan to 'starter'/'standard' for the build or set
    #     NODE_OPTIONS=--max-old-space-size=460 to make V8 collect harder rather
    #     than let the container OOM.
    #   - Spins down after ~15 min without inbound traffic; the next visitor pays
    #     a cold start while the Node server boots.
