apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
spec:
  serviceName: chroma
  # One node. Chroma server replaces N divergent per-pod directories with one
  # correct shared corpus -- which is the point -- but it is a SHARED service,
  # not a scaled one, and it is a single point of failure for the read path.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chroma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chroma
    spec:
      containers:
        - name: chroma
          image: chromadb/chroma:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: IS_PERSISTENT
              value: "TRUE"
            - name: ANONYMIZED_TELEMETRY
              value: "False"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              # v2. The v1 heartbeat returns 410 Gone on current images, so a
              # probe against it marks a healthy pod unready forever.
              path: /api/v2/heartbeat
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
