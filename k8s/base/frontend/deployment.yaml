apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      containers:
        - name: frontend
          image: roger-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          # NOTE: there is deliberately no NEXT_PUBLIC_* env here.
          #
          # Next inlines those into the client bundle at BUILD time. Setting
          # them on the pod does nothing at all -- the most common way this
          # frontend ends up deployed still calling localhost:8000. They are
          # build args in frontend/Dockerfile; changing the API URL means
          # rebuilding the image, not restarting the pod.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
