# Render Blueprint — Roger Intelligence Platform backend
# Docs: https://render.com/docs/blueprint-spec
#
# The frontend is NOT defined here; it deploys to Vercel (see DEPLOY.md).
#
# Apply with: Render Dashboard -> New -> Blueprint -> pick this repo.

services:
  - type: web
    name: roger-backend
    runtime: docker

    # Dockerfile lives in backend/, but the build context MUST be the repo root:
    # the image needs models/ (a sibling of backend/), and main.py resolves it as
    # Path(__file__).parent.parent / "models".
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .

    region: singapore          # closest to Sri Lanka; also: oregon, frankfurt, ohio, virginia

    # FREE TIER = 512 MB RAM. This fits — but only because the image installs
    # backend/requirements-service.txt (slim) rather than requirements.txt.
    #
    # Measured on a clean venv from the slim set: `import main` settles at
    # ~210 MB RSS with 46 routes and zero heavy modules loaded.
    #
    # The earlier OOM came from requirements.txt pulling torch + transformers:
    # the backend never imports them itself, but langchain_groq imports
    # `transformers` if it is installed, which imports `torch`. Not installing
    # them removes ~3 GB of stack. See requirements-service.txt.
    #
    # Still true on free: the service spins down after ~15 min without inbound
    # traffic, and the next request pays a cold start.
    plan: free

    healthCheckPath: /api/status

    # NOTE: no 'disk:' block — Render does not offer persistent disks on the free
    # plan. The paths below still work, but live on the container's ephemeral
    # filesystem: the SQLite dedup cache and ChromaDB vector store are wiped on
    # every deploy, restart and spin-down. Collected intelligence does not survive.
    # Re-add a disk (and a paid plan) to persist them.

    envVars:
      # --- Required secrets (set in the dashboard; never committed) ---
      - key: GROQ_API_KEY
        sync: false

      # --- Accounts and sessions -------------------------------------------
      #
      # Without DATABASE_URL the service silently falls back to a SQLite file on
      # the container's ephemeral disk, so every account, exposure profile,
      # story and paired device is destroyed on the next deploy or spin-down.
      # It looks like it works right up until it doesn't.
      #
      # Use the Supabase TRANSACTION POOLER (port 6543), not the direct 5432
      # connection: Supabase's direct host is IPv6-only on new projects and
      # Render's outbound is not guaranteed IPv6. auth/db.py detects :6543 and
      # switches to NullPool with prepared statements disabled, which is what
      # PgBouncer transaction mode requires.
      #
      #   postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres
      - key: DATABASE_URL
        sync: false

      # HS256 signing key, >= 32 chars. Render generates and stores it; leaving
      # it unset makes auth/config.py mint a random key per boot, which
      # invalidates every session on every restart.
      - key: AUTH_SECRET
        generateValue: true

      # 1 = tokens are required. Keep this on in production: with it off, every
      # API route is publicly readable AND writable, including the connector
      # pairing endpoints.
      - key: AUTH_ENFORCED
        value: "1"

      # There is no self-registration, so the FIRST user can only come from
      # here. With these unset, _seed_admin() returns early and nobody can ever
      # log in -- the whole authenticated surface is unreachable.
      # Seeded once, only into an empty user table; change the password after
      # the first login.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

      # --- Deployment safety ---
      # Do NOT train inside the web service: it OOMs even a 2 GB instance (let
      # alone free's 512 MB) and delays the $PORT bind past the health-check
      # window. Ship pre-trained artifacts (committed under models/*/artifacts/).
      - key: DISABLE_AUTO_TRAIN
        value: "1"

      # Hold off the first agent cycle so the health check can pass first.
      # A cycle fans out to five scraping agents and launches Playwright
      # Chromium; starting that the instant the port binds starves /api/status
      # past Render's 5 s health-check timeout, the instance is killed, and the
      # restart begins another cycle — a crash loop. 0 restores the old behaviour.
      - key: AGENT_LOOP_START_DELAY
        value: "45"

      # Set to "1" to serve the API without the scraping agents at all.
      # Chromium is 100-300 MB on top of the ~210 MB base, which is what tips a
      # 512 MB free instance over. Feeds then come only from stored/cached data.
      - key: DISABLE_AGENT_LOOP
        value: "0"

      # Lock CORS to the frontend origin. Leaving this unset falls back to "*"
      # (with credentials disabled, per the CORS spec).
      # e.g. https://slac2026-frontend.onrender.com
      - key: CORS_ALLOW_ORIGINS
        sync: false

      # --- Storage paths (ephemeral on free; see the note above) ---
      - key: SQLITE_DB_PATH
        value: /app/backend/data/cache/feeds.db
      - key: CHROMADB_PATH
        value: /app/backend/data/chromadb
      - key: CSV_EXPORT_DIR
        value: /app/backend/data/feeds

      # --- ML inference mode -----------------------------------------------
      #
      # {WEATHER,CURRENCY,STOCK,ANOMALY}_SERVICE_URL are deliberately NOT
      # declared. src/model_gateway.py treats an unset URL as "run this model
      # in-process", which is what we want on a single free instance:
      #
      #   anomaly  -> RUNS HERE. Its artifacts are scikit-learn .joblib
      #               (isolation forest, DBSCAN, LOF, k-means), and the slim
      #               requirement set installs scikit-learn for exactly this.
      #   weather, currency, stock
      #            -> report "unavailable". They are Keras .h5 and need
      #               TensorFlow, which does not fit in 512 MB alongside the
      #               API. Set their *_SERVICE_URL to a dedicated instance to
      #               enable them; until then the UI says so rather than
      #               showing a card that looks broken.
      - key: ML_INFERENCE_NOTE
        value: "anomaly=in-process; weather/currency/stock=needs TF service"

      # --- Optional integrations (leave unset to disable) ---
      - key: NEO4J_ENABLED
        value: "false"
      - key: LANGSMITH_API_KEY
        sync: false

      - key: PYTHONUNBUFFERED
        value: "1"
