# Render Blueprint — Roger Intelligence Platform backend
# Docs: https://render.com/docs/blueprint-spec
#
# The frontend is NOT defined here; it deploys to Vercel (see DEPLOY.md).
#
# Apply with: Render Dashboard -> New -> Blueprint -> pick this repo.

services:
  - type: web
    name: roger-backend
    runtime: docker

    # Dockerfile lives in backend/, but the build context MUST be the repo root:
    # the image needs models/ (a sibling of backend/), and main.py resolves it as
    # Path(__file__).parent.parent / "models".
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .

    region: singapore          # closest to Sri Lanka; also: oregon, frankfurt, ohio, virginia
    plan: standard             # 2 GB RAM. See DEPLOY.md — 'pro' (4 GB) is safer.

    healthCheckPath: /api/status

    # SQLite dedup cache + ChromaDB vector store. Render's filesystem is
    # ephemeral, so without this every deploy/restart wipes all collected feeds.
    # NOTE: attaching a disk pins the service to 1 instance and disables
    # zero-downtime deploys.
    disk:
      name: roger-data
      mountPath: /app/backend/data
      sizeGB: 10

    envVars:
      # --- Required secrets (set in the dashboard; never committed) ---
      - key: GROQ_API_KEY
        sync: false

      # --- Deployment safety ---
      # Do NOT train inside the web service: it OOMs a 2 GB instance and delays
      # the $PORT bind past the health-check window. Ship pre-trained artifacts
      # (already committed under models/*/artifacts/).
      - key: DISABLE_AUTO_TRAIN
        value: "1"

      # Lock CORS to the Vercel origin. Leaving this unset falls back to "*"
      # (with credentials disabled, per the CORS spec).
      # e.g. https://your-app.vercel.app
      - key: CORS_ALLOW_ORIGINS
        sync: false

      # --- Storage paths (must sit under the mounted disk) ---
      - key: SQLITE_DB_PATH
        value: /app/backend/data/cache/feeds.db
      - key: CHROMADB_PATH
        value: /app/backend/data/chromadb
      - key: CSV_EXPORT_DIR
        value: /app/backend/data/feeds

      # --- Optional integrations (leave unset to disable) ---
      - key: NEO4J_ENABLED
        value: "false"
      - key: LANGSMITH_API_KEY
        sync: false

      - key: PYTHONUNBUFFERED
        value: "1"
